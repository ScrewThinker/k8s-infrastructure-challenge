name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Python backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests

      - name: Build React frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - name: Validate Kubernetes manifests
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1

      - run: kubectl apply --dry-run=client --validate=false -f k8s/

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tag
        id: image
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/screwthinker/k8s-infrastructure-challenge-backend:${{ steps.image.outputs.tag }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/screwthinker/k8s-infrastructure-challenge-frontend:${{ steps.image.outputs.tag }}

      - name: Update GitOps image tags
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          sed -i -E "s|(image: ghcr.io/screwthinker/k8s-infrastructure-challenge-backend:).*|\1${IMAGE_TAG}|" k8s/backend.yaml
          sed -i -E "s|(image: ghcr.io/screwthinker/k8s-infrastructure-challenge-frontend:).*|\1${IMAGE_TAG}|" k8s/frontend.yaml
          git diff --quiet && { echo "Image tag already current"; exit 0; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "deploy: ${IMAGE_TAG} [skip ci]"
          git push
