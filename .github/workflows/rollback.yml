name: Roll back deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing GHCR tag, for example sha-a1b2c3d
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and apply previous image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{7}$ ]] || { echo "Invalid tag: $IMAGE_TAG"; exit 1; }
          sed -i -E "s/^    tag: \"[^\"]+\"/    tag: \"${IMAGE_TAG}\"/" helm/challenge/values.yaml
          git diff --quiet && { echo "Image tag already current"; exit 0; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add helm/challenge/values.yaml
          git commit -m "rollback: ${IMAGE_TAG}"
          git push
