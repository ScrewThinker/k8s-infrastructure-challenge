apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenge-infrastructure-challenge-backend
  namespace: infra-challenge
  labels:
    app.kubernetes.io/name: infrastructure-challenge
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: backend
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: challenge
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: challenge
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/screwthinker/k8s-infrastructure-challenge-backend:sha-6a7553c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_MESSAGE
              value: "Deployment successful — React is talking to Python."
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secret
                  key: APP_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: challenge-infrastructure-challenge-backend
  namespace: infra-challenge
  labels:
    app.kubernetes.io/name: infrastructure-challenge
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  selector:
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: challenge-infrastructure-challenge-backend-metrics
  namespace: infra-challenge
  labels:
    app.kubernetes.io/name: infrastructure-challenge
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: backend-metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: backend
  ports:
    - name: metrics
      port: 8000
      targetPort: http
