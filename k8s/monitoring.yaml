apiVersion: v1
kind: ConfigMap
metadata:
  name: challenge-infrastructure-challenge-prometheus
  namespace: infra-challenge
  labels:
    app.kubernetes.io/name: infrastructure-challenge
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: challenge-backend
        dns_sd_configs:
          - names: ['challenge-infrastructure-challenge-backend-metrics']
            type: A
            port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenge-infrastructure-challenge-prometheus
  namespace: infra-challenge
  labels:
    app.kubernetes.io/name: infrastructure-challenge
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: challenge
      app.kubernetes.io/component: monitoring
  template:
    metadata:
      annotations:
        config-revision: "1"
      labels:
        app.kubernetes.io/instance: challenge
        app.kubernetes.io/component: monitoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
          ports:
            - name: http
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: challenge-infrastructure-challenge-prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: challenge-infrastructure-challenge-prometheus
  namespace: infra-challenge
  labels:
    app.kubernetes.io/name: infrastructure-challenge
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: monitoring
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
