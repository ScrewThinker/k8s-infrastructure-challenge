apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenge-infrastructure-challenge-frontend
  namespace: infra-challenge
  labels:
    app.kubernetes.io/name: infrastructure-challenge
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: challenge
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: challenge
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/screwthinker/k8s-infrastructure-challenge-frontend:sha-d9e5d69
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_HOST
              value: challenge-infrastructure-challenge-backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: challenge-infrastructure-challenge-frontend
  namespace: infra-challenge
  labels:
    app.kubernetes.io/name: infrastructure-challenge
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: challenge
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
