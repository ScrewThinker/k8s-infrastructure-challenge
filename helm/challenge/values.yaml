images:
  frontend:
    repository: ghcr.io/screwthinker/k8s-infrastructure-challenge-frontend
    tag: "local"
    pullPolicy: IfNotPresent
  backend:
    repository: ghcr.io/screwthinker/k8s-infrastructure-challenge-backend
    tag: "local"
    pullPolicy: IfNotPresent

secret:
  existingSecret: challenge-app-secret
  key: APP_TOKEN

backend:
  replicas: 2
  message: "Deployment successful — React is talking to Python."
  servicePort: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

frontend:
  replicas: 2
  backendHost: ""
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

monitoring:
  enabled: true
  image: prom/prometheus:v3.5.0
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
